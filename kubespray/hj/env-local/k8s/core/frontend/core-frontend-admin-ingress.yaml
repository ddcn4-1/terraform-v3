apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: frontend-admin-ingress
    namespace: core
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - local.admin.ddcn41.com
          secretName: ddcn41-tls
    rules:
        - host: local.admin.ddcn41.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend-admin
                            port:
                                number: 3001
