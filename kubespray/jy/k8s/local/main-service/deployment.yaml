apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ticketing-system-main
  name: ticketing-system-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-main
  strategy: {}
  template:
    metadata:
      labels:
        app: ticketing-system-main
    spec:
      containers:
      - image: 172.25.46.1:5000/ddcn41/msa/main
        name: main
        envFrom:
        - secretRef:
            name: main-service-env
        resources:
          limits:
            memory: 700Mi
      imagePullSecrets:
      - name: regcred
status: {}
