apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ticketing-system-queue
  name: ticketing-system-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-queue
  strategy: {}
  template:
    metadata:
      labels:
        app: ticketing-system-queue
    spec:
      containers:
      - image: 172.25.46.1:5000/ddcn41/msa/queue
        name: main
        envFrom:
        - secretRef:
            name: queue-service-env
        resources:
          limits: 
            memory: 512Mi
      imagePullSecrets:
      - name: regcred
status: {}
