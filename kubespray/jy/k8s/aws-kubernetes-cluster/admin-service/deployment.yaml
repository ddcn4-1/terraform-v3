apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ticketing-system-admin
  name: ticketing-system-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-admin
  strategy: {}
  template:
    metadata:
      labels:
        app: ticketing-system-admin
    spec:
      containers:
      - image: 968190279976.dkr.ecr.ap-northeast-2.amazonaws.com/ddcn41/msa/admin 
        name: admin
        envFrom:
        - configMapRef:
            name: admin-service-config
        - secretRef:
            name: backend-need-endpoint
        - secretRef:
            name: backend-need-key
        resources:
          limits:
            memory: 512Mi
      imagePullSecrets:
      - name: regcred
status: {}
