apiVersion: v2
name: mini-msa
description: >-
  Mini microservice architecture demo (core + queue + postgres + redis) packaged as a Helm chart.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - microservices
  - nodejs
  - postgres
  - redis
home: https://github.com/mini-msa
sources:
  - https://github.com/mini-msa/mini-msa
maintainers:
  - name: Mini MSA Team
    email: ops@mini-msa.local
annotations:
  category: application

# Dependencies
dependencies:
  - name: kube-prometheus-stack
    version: "54.2.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: kubernetes-dashboard
    version: "7.14.0"
    repository: "https://kubernetes.github.io/dashboard/"
    condition: monitoring.dashboard.enabled
