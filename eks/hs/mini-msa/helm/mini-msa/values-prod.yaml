# Production overrides (EKS)
global:
  commonLabels:
    environment: prod
  imagePullSecrets:
    - name: ecr-cred

coreService:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/core-service
    tag: v1.0.0
  service:
    type: ClusterIP
  ingress:
    enabled: true
    hosts:
      - host: api.mini-msa.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: mini-msa-tls
        hosts:
          - api.mini-msa.example.com
  additionalIngresses:
    alb:
      enabled: true
      hosts:
        - host: api.mini-msa.example.com
          paths:
            - path: /
              pathType: Prefix
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

queueService:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/queue-service
    tag: v1.0.0
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

redis:
  persistence:
    size: 10Gi
