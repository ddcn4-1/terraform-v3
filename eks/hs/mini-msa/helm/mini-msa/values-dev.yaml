# Development overrides (Docker Desktop / kind)
global:
  commonLabels:
    environment: dev
  nodeSelector: {}
  tolerations: []

coreService:
  replicaCount: 1
  image:
    repository: core-service
    tag: latest
  service:
    type: NodePort
    nodePort: 30002
  ingress:
    enabled: true
    hosts:
      - host: mini-msa.local
        paths:
          - path: /
            pathType: Prefix
  additionalIngresses:
    alb:
      enabled: false
  config:
    nodeEnv: development
  resources:
    limits:
      cpu: 250m
      memory: 256Mi

queueService:
  replicaCount: 1
  image:
    repository: queue-service
    tag: latest
  service:
    type: NodePort
    nodePort: 30001
  config:
    nodeEnv: development
  resources:
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  persistence:
    size: 1Gi

redis:
  persistence:
    size: 1Gi

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    kube-prometheus-stack:
      prometheus:
        prometheusSpec:
          retention: 7d
          storageSpec:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 20Gi
      grafana:
        enabled: true
        adminPassword: "admin"
        ingress:
          enabled: false
        service:
          type: ClusterIP
          port: 80

# Logging Configuration (ELK Stack) - Development overrides
logging:
  eck:
    operator:
      enabled: false  # Set to true to enable ELK stack in development
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

  elasticsearch:
    enabled: true
    version: "8.11.0"
    nodeSets:
      - name: default
        count: 1
        config:
          node.store.allow_mmap: false
        volumeClaimTemplates:
          - metadata:
              name: elasticsearch-data
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: "standard"
              resources:
                requests:
                  storage: 5Gi
        podTemplate:
          spec:
            containers:
              - name: elasticsearch
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 200m
                  limits:
                    memory: 1Gi
                    cpu: 500m
                env:
                  - name: ES_JAVA_OPTS
                    value: "-Xms256m -Xmx256m"

  kibana:
    enabled: true
    version: "8.11.0"
    count: 1
    http:
      service:
        spec:
          type: NodePort
    podTemplate:
      spec:
        containers:
          - name: kibana
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 300m

  filebeat:
    enabled: true  # Enabled for log collection
    version: "8.11.0"
    daemonSet:
      podTemplate:
        spec:
          serviceAccountName: filebeat
          automountServiceAccountToken: true
          dnsPolicy: ClusterFirstWithHostNet
          hostNetwork: true
          securityContext:
            runAsUser: 0
          containers:
            - name: filebeat
              securityContext:
                runAsUser: 0
                privileged: true
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
                  cpu: 200m
              volumeMounts:
                - name: varlogcontainers
                  mountPath: /var/log/containers
                  readOnly: true
                - name: varlogpods
                  mountPath: /var/log/pods
                  readOnly: true
                - name: varlibdockercontainers
                  mountPath: /var/lib/docker/containers
                  readOnly: true
          volumes:
            - name: varlogcontainers
              hostPath:
                path: /var/log/containers
            - name: varlogpods
              hostPath:
                path: /var/log/pods
            - name: varlibdockercontainers
              hostPath:
                path: /var/lib/docker/containers
