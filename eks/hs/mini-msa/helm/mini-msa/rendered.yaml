    helm.sh/chart: mini-msa-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mini-msa
    app.kubernetes.io/component: redis
    environment: dev
    app: redis
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mini-msa
      app.kubernetes.io/instance: mini-msa
      app.kubernetes.io/component: redis
      app: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mini-msa
        app.kubernetes.io/instance: mini-msa
        app.kubernetes.io/component: redis
        environment: dev
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: REDIS_PASSWORD
              valueFrom:
