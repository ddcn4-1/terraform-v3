# Source: mini-msa/templates/core-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-msa-core-service
  namespace: mini-msa-app
  labels:
    app.kubernetes.io/name: mini-msa
    app.kubernetes.io/instance: mini-msa
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: mini-msa-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mini-msa
    app.kubernetes.io/component: core
    app: core-service
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mini-msa
      app.kubernetes.io/instance: mini-msa
      app.kubernetes.io/component: core
      app: core-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mini-msa
        app.kubernetes.io/instance: mini-msa
        app.kubernetes.io/component: core
        app: core-service
        environment: dev
    spec:
      serviceAccountName: default
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - core
              topologyKey: kubernetes.io/hostname
            weight: 100
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-queue-service
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z queue-service.mini-msa-app.svc.cluster.local 3001; do
                echo "Waiting for Queue Service..."
                sleep 2
              done
              echo "Queue Service is ready!"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: mini-msa-core-service
          image: core-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /app/.npm
              name: app-cache
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: SERVICE_NAME
            - name: QUEUE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: QUEUE_SERVICE_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: NODE_ENV
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: POSTGRES_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mini-msa-core-service-config
                  key: REDIS_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: app-cache
