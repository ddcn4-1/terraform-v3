---
# PostgreSQL secret for mini-msa-app namespace
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mini-msa-app
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DB: mini_msa
---
# Redis secret for mini-msa-app namespace
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: mini-msa-app
type: Opaque
stringData:
  REDIS_PASSWORD: redis123
