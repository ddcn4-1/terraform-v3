# Velero role variables
# 이 값들은 inventory 또는 playbook에서 override 가능

# Project specific
project_name: "ticket-hs"
environment: "prod"

# Seoul (Primary)
seoul_region: "ap-northeast-2"
seoul_bucket: "{{ project_name }}-velero-{{ environment }}-{{ seoul_region }}"
seoul_cluster: "{{ project_name }}-cluster"

# Tokyo (DR)
tokyo_region: "ap-northeast-1"
tokyo_bucket: "{{ project_name }}-velero-{{ environment }}-{{ tokyo_region }}"
tokyo_cluster: "{{ project_name }}-cluster"
