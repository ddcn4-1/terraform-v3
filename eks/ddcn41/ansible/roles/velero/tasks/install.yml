---
# Velero installation tasks

- name: Update kubeconfig for target cluster
  ansible.builtin.command:
    cmd: "aws eks update-kubeconfig --region {{ aws_region }} --name {{ cluster_name }}"
  changed_when: true

- name: Add Velero Helm repository
  kubernetes.core.helm_repository:
    name: vmware-tanzu
    repo_url: "{{ velero_helm_repo }}"
    state: present

- name: Create Velero namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ velero_namespace }}"
        labels:
          app.kubernetes.io/name: velero
          app.kubernetes.io/managed-by: ansible

- name: Set Terraform directory for IAM Role lookup
  ansible.builtin.set_fact:
    # Tokyo는 Seoul의 IAM Role을 재사용하므로 Seoul Terraform output 참조
    velero_role_terraform_dir: "{{ terraform_dir | replace('/tokyo', '/seoul') if velero_role_source | default('') == 'seoul' and 'tokyo' in terraform_dir else terraform_dir }}"
  when: velero_role_arn is not defined

- name: Get Velero IAM role ARN from Terraform output
  ansible.builtin.command:
    cmd: "terraform -chdir={{ velero_role_terraform_dir | default(terraform_dir) }} output -raw velero_role_arn"
  register: velero_role_arn_output
  changed_when: false
  when: velero_role_arn is not defined

- name: Set Velero role ARN fact
  ansible.builtin.set_fact:
    velero_role_arn: "{{ velero_role_arn_output.stdout }}"
  when: velero_role_arn is not defined

- name: Install Velero using Helm
  kubernetes.core.helm:
    name: velero
    chart_ref: vmware-tanzu/velero
    chart_version: "{{ velero_helm_chart_version }}"
    release_namespace: "{{ velero_namespace }}"
    create_namespace: true
    wait: true
    timeout: 10m0s
    values:
      # Disable CRD upgrade job (causes issues with velero container crash)
      # CRDs are installed automatically with Helm chart
      upgradeCRDs: false
      # kubectl image for CRD upgrade job (backup option if upgradeCRDs is enabled)
      kubectl:
        image:
          repository: docker.io/bitnami/kubectl
          tag: latest
      initContainers:
        - name: velero-plugin-for-aws
          image: "velero/velero-plugin-for-aws:v{{ velero_plugin_version }}"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /target
              name: plugins
      configuration:
        backupStorageLocation:
          - name: default
            provider: aws
            bucket: "{{ velero_bucket }}"
            config:
              region: "{{ aws_region }}"
        volumeSnapshotLocation:
          - name: default
            provider: aws
            config:
              region: "{{ aws_region }}"
      serviceAccount:
        server:
          name: velero  # Must match IAM Trust Policy: system:serviceaccount:velero:velero
          annotations:
            eks.amazonaws.com/role-arn: "{{ velero_role_arn }}"
      deployNodeAgent: true
      nodeAgent:
        podSecurityPolicy:
          enabled: false
      credentials:
        useSecret: false

- name: Wait for Velero deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ velero_namespace }}"
    name: velero
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Verify Velero installation
  ansible.builtin.command:
    cmd: velero version
  register: velero_version_output
  changed_when: false

- name: Display Velero version
  ansible.builtin.debug:
    msg: "{{ velero_version_output.stdout_lines }}"
