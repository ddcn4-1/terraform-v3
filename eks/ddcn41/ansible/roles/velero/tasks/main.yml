---
# Velero role main tasks
# action 변수에 따라 적절한 task 파일 실행

- name: Include install tasks
  ansible.builtin.include_tasks: install.yml
  when: action == 'install'

- name: Include backup tasks
  ansible.builtin.include_tasks: backup.yml
  when: action == 'backup'

- name: Include restore tasks
  ansible.builtin.include_tasks: restore.yml
  when: action == 'restore'

- name: Include uninstall tasks
  ansible.builtin.include_tasks: uninstall.yml
  when: action == 'uninstall'

- name: Include DR failover tasks
  ansible.builtin.include_tasks: dr_failover.yml
  when: action == 'dr_failover'
