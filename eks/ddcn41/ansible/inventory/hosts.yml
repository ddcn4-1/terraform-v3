# Ansible inventory for Velero DR operations
# localhost를 사용하여 kubectl/velero CLI 실행
#
# NOTE: Since both seoul and tokyo use localhost, we cannot use group_vars
# directly in this file (last group wins). Instead, we use a lookup pattern
# in the playbook based on the 'target' variable.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  # Cluster configurations (used via lookup, not as host groups)
  vars:
    cluster_configs:
      seoul:
        region: ap-northeast-2
        cluster_name: ddcn41-eks-cluster
        velero_bucket: ddcn41-eks-velero-prod-ap-northeast-2
        is_primary: true
        velero_role_source: seoul
      tokyo:
        region: ap-northeast-1
        cluster_name: ddcn41-eks-cluster
        velero_bucket: ddcn41-eks-velero-prod-ap-northeast-1
        is_primary: false
        velero_role_source: seoul
