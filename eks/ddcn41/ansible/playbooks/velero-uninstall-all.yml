---
# Velero Uninstall All - Seoul & Tokyo 동시 삭제
#
# Usage: ansible-playbook playbooks/velero-uninstall-all.yml

- name: Uninstall Velero from All Clusters
  hosts: localhost
  gather_facts: true

  vars:
    clusters:
      - name: tokyo
        region: ap-northeast-1
        cluster_name: ddcn41-eks-cluster
      - name: seoul
        region: ap-northeast-2
        cluster_name: ddcn41-eks-cluster

    # Uninstall options
    delete_namespace: true
    delete_backups: false
    delete_restores: true

  tasks:
    - name: Display uninstall plan
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║           Velero Multi-Cluster Uninstall                         ║
          ╠══════════════════════════════════════════════════════════════════╣
          {% for cluster in clusters %}
          ║  {{ cluster.name | upper }}: {{ cluster.cluster_name }}
          {% endfor %}
          ║                                                                  ║
          ║  Delete Backups: {{ delete_backups }}
          ║  Delete Restores: {{ delete_restores }}
          ╚══════════════════════════════════════════════════════════════════╝

    - name: Confirm uninstallation
      ansible.builtin.pause:
        prompt: "Press Enter to continue or Ctrl+C to abort"
      when: not (auto_confirm | default(false))

    - name: Uninstall Velero from each cluster
      ansible.builtin.include_tasks: ../roles/velero/tasks/uninstall.yml
      vars:
        aws_region: "{{ item.region }}"
        cluster_name: "{{ item.cluster_name }}"
        velero_namespace: velero
        action: uninstall
      loop: "{{ clusters }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Uninstall complete
      ansible.builtin.debug:
        msg: |
          Velero uninstalled from all clusters.
          Note: S3 backups are preserved. Delete manually if needed.
