apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketing-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ddcn4-1/terraform-v3.git
    targetRevision: eks-dh
    path: eks/dh/ticketing-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
